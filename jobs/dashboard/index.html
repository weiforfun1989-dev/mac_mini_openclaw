<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Dispatch Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f23;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #00d4ff;
        }
        .stat-label {
            color: #888;
            font-size: 0.9em;
        }
        .jobs-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .job-card {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #2a2a4a;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .job-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.1);
        }
        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .job-id {
            font-size: 0.85em;
            color: #888;
            font-family: monospace;
        }
        .job-status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-todo { background: #444; color: #aaa; }
        .status-in_progress { background: #f0a500; color: #1a1a2e; }
        .status-done { background: #00d4ff; color: #0f0f23; }
        .job-title {
            font-size: 1.3em;
            margin-bottom: 10px;
            color: #fff;
        }
        .job-meta {
            display: flex;
            gap: 20px;
            color: #888;
            font-size: 0.9em;
            margin-bottom: 15px;
        }
        .job-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .progress-bar {
            height: 6px;
            background: #2a2a4a;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            transition: width 0.5s ease;
        }
        .sub-jobs {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #2a2a4a;
        }
        .sub-jobs-title {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .sub-job {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .sub-job-icon {
            font-size: 1.2em;
        }
        .sub-job-agent {
            font-size: 0.75em;
            padding: 2px 8px;
            border-radius: 10px;
            background: #333;
            color: #aaa;
        }
        .sub-job-agent.mac { background: #7b2cbf; color: #fff; }
        .sub-job-agent.glitch { background: #f0a500; color: #1a1a2e; }
        .sub-job-agent.research { background: #00d4ff; color: #0f0f23; }
        .sub-job-agent.planning { background: #00ff88; color: #0f0f23; }
        .sub-job-desc {
            flex: 1;
            font-size: 0.9em;
            color: #ccc;
        }
        .refresh-info {
            text-align: center;
            color: #666;
            font-size: 0.85em;
            margin-top: 30px;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎯 Job Dispatch Dashboard</h1>
        <p>Multi-Agent Workflow Coordination</p>
        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="total-jobs">0</div>
                <div class="stat-label">Total Jobs</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="active-jobs">0</div>
                <div class="stat-label">In Progress</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="completed-jobs">0</div>
                <div class="stat-label">Completed</div>
            </div>
        </div>
    </div>

    <div class="jobs-container" id="jobs-container">
        <!-- Jobs will be loaded here -->
    </div>

    <div class="refresh-info">
        Auto-refreshes every 5 seconds • Last updated: <span id="last-updated">--</span>
    </div>

    <script>
        const API_URL = '/api/jobs';

        function formatDate(isoString) {
            if (!isoString) return 'N/A';
            const date = new Date(isoString);
            return date.toLocaleString();
        }

        function getStatusClass(status) {
            return `status-${status.toLowerCase()}`;
        }

        function getAgentClass(agent) {
            const agentLower = agent.toLowerCase();
            if (agentLower.includes('mac')) return 'mac';
            if (agentLower.includes('glitch')) return 'glitch';
            if (agentLower.includes('research')) return 'research';
            if (agentLower.includes('planning')) return 'planning';
            return '';
        }

        function getStatusIcon(status) {
            if (status === 'DONE') return '✅';
            if (status === 'IN_PROGRESS') return '🔄';
            return '⏳';
        }

        function calculateProgress(job, allJobs) {
            if (!job.sub_jobs || job.sub_jobs.length === 0) {
                return job.status === 'DONE' ? 100 : 0;
            }
            const doneCount = job.sub_jobs.filter(id => {
                const sub = allJobs.find(j => j.id === id);
                return sub && sub.status === 'DONE';
            }).length;
            return Math.round((doneCount / job.sub_jobs.length) * 100);
        }

        function renderJobCard(job, allJobs) {
            const progress = calculateProgress(job, allJobs);
            const subJobsHtml = job.sub_jobs && job.sub_jobs.length > 0 
                ? job.sub_jobs.map(subId => {
                    const sub = allJobs.find(j => j.id === subId);
                    if (!sub) return '';
                    return `
                        <div class="sub-job">
                            <span class="sub-job-icon">${getStatusIcon(sub.status)}</span>
                            <span class="sub-job-agent ${getAgentClass(sub.assigned_to)}">${sub.assigned_to}</span>
                            <span class="sub-job-desc">${sub.description}</span>
                        </div>
                    `;
                }).join('')
                : '';

            return `
                <div class="job-card">
                    <div class="job-header">
                        <span class="job-id">#${job.id}</span>
                        <span class="job-status ${getStatusClass(job.status)}">${job.status}</span>
                    </div>
                    <div class="job-title">${job.description}</div>
                    <div class="job-meta">
                        <span>👤 ${job.assigned_to}</span>
                        <span>📅 ${formatDate(job.created_at)}</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progress}%"></div>
                    </div>
                    ${subJobsHtml ? `
                        <div class="sub-jobs">
                            <div class="sub-jobs-title">Sub-jobs (${job.sub_jobs.length})</div>
                            ${subJobsHtml}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderEmptyState() {
            return `
                <div class="empty-state">
                    <div class="empty-state-icon">📭</div>
                    <h2>No jobs yet</h2>
                    <p>Create your first job with: <code>jobs create "Your task"</code></p>
                </div>
            `;
        }

        async function loadJobs() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                const container = document.getElementById('jobs-container');
                const allJobs = data.jobs || [];
                
                // Update stats
                document.getElementById('total-jobs').textContent = allJobs.length;
                document.getElementById('active-jobs').textContent = 
                    allJobs.filter(j => j.status === 'IN_PROGRESS').length;
                document.getElementById('completed-jobs').textContent = 
                    allJobs.filter(j => j.status === 'DONE').length;
                
                // Get main jobs (no parent)
                const mainJobs = allJobs.filter(j => j.parent_id === null);
                
                if (mainJobs.length === 0) {
                    container.innerHTML = renderEmptyState();
                } else {
                    container.innerHTML = mainJobs
                        .sort((a, b) => b.id - a.id)
                        .map(job => renderJobCard(job, allJobs))
                        .join('');
                }
                
                document.getElementById('last-updated').textContent = new Date().toLocaleTimeString();
            } catch (error) {
                console.error('Failed to load jobs:', error);
                document.getElementById('jobs-container').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <h2>Failed to load jobs</h2>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // Load jobs initially and every 5 seconds
        loadJobs();
        setInterval(loadJobs, 5000);
    </script>
</body>
</html>
