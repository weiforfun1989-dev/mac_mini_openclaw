<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Dispatch Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f23;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
        }
        .stat { text-align: center; }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #00d4ff;
        }
        .stat-label { color: #888; font-size: 0.9em; }

        /* Active Agents */
        .active-agents {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
            min-height: 40px;
        }
        .active-agent-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            border: 2px solid;
            animation: pulse 2s infinite;
        }
        .active-agent-badge.mac { border-color: #7b2cbf; color: #fff; }
        .active-agent-badge.glitch { border-color: #f0a500; color: #f0a500; }
        .active-agent-badge.research { border-color: #00d4ff; color: #00d4ff; }
        .active-agent-badge.planning { border-color: #00ff88; color: #00ff88; }
        .active-agent-badge .indicator {
            width: 8px; height: 8px; border-radius: 50%;
            background: currentColor; animation: blink 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 5px currentColor; }
            50% { box-shadow: 0 0 20px currentColor; }
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* Filter buttons */
        .agent-filter {
            display: flex; justify-content: center; gap: 10px;
            margin: 20px 0; flex-wrap: wrap;
        }
        .agent-btn {
            padding: 8px 16px; border: 1px solid #444;
            background: #1a1a2e; color: #888;
            border-radius: 20px; cursor: pointer;
            transition: all 0.2s; font-size: 0.9em;
        }
        .agent-btn:hover { border-color: #00d4ff; color: #fff; }
        .agent-btn.active {
            background: #00d4ff; color: #0f0f23;
            border-color: #00d4ff; font-weight: 600;
        }

        /* Agents Grid */
        .agents-overview { margin-bottom: 30px; }
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }
        .agent-card {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 12px; padding: 20px;
            border: 1px solid #2a2a4a;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .agent-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.1);
        }
        .agent-card-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 15px;
            padding-bottom: 15px; border-bottom: 1px solid #2a2a4a;
        }
        .agent-card-name { font-size: 1.3em; font-weight: bold; }
        .agent-card-badge {
            font-size: 0.75em; padding: 4px 10px;
            border-radius: 12px; font-weight: 600;
        }
        .agent-card-badge.mac { background: #7b2cbf; color: #fff; }
        .agent-card-badge.glitch { background: #f0a500; color: #1a1a2e; }
        .agent-card-badge.research { background: #00d4ff; color: #0f0f23; }
        .agent-card-badge.planning { background: #00ff88; color: #0f0f23; }
        .agent-card-stats {
            display: flex; gap: 15px; margin-bottom: 15px;
        }
        .agent-card-stat {
            text-align: center; flex: 1;
            padding: 10px; background: rgba(0,0,0,0.2);
            border-radius: 8px;
        }
        .agent-card-stat-value { font-size: 1.5em; font-weight: bold; }
        .agent-card-stat-label { font-size: 0.75em; color: #888; margin-top: 4px; }

        /* Job Queue Items */
        .agent-card-queue { margin-top: 15px; }
        .agent-card-queue-title {
            font-size: 0.8em; color: #888;
            text-transform: uppercase; margin-bottom: 8px;
        }
        .agent-card-queue-item {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 10px; background: rgba(0,0,0,0.15);
            border-radius: 4px; margin-bottom: 6px;
            font-size: 0.9em; cursor: pointer;
            transition: background 0.2s;
        }
        .agent-card-queue-item:hover { background: rgba(255,255,255,0.1); }

        /* Progress bar for in-progress jobs */
        .job-progress-container {
            margin-top: 6px;
            height: 4px;
            background: #2a2a4a;
            border-radius: 2px;
            overflow: hidden;
        }
        .job-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #f0a500, #ff6b35);
            transition: width 1s ease;
            animation: progress-pulse 2s infinite;
        }
        @keyframes progress-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .job-progress-text {
            font-size: 0.75em;
            color: #888;
            margin-top: 4px;
        }

        .agent-card-empty {
            color: #666; font-style: italic;
            padding: 10px; text-align: center;
        }
        .expand-link {
            color: #00d4ff; cursor: pointer;
            text-align: center; padding: 5px;
            font-size: 0.85em;
        }
        .expand-link:hover { text-decoration: underline; }

        /* Job Detail Modal */
        .modal-overlay {
            display: none; position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000; justify-content: center;
            align-items: center; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #1a1a2e;
            border-radius: 12px; padding: 30px;
            max-width: 600px; width: 100%;
            max-height: 80vh; overflow-y: auto;
            border: 1px solid #2a2a4a;
        }
        .modal-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 20px;
        }
        .modal-close {
            font-size: 1.5em; cursor: pointer;
            color: #888;
        }
        .modal-close:hover { color: #fff; }
        .detail-row {
            display: flex; gap: 15px; margin-bottom: 12px;
            padding: 10px; background: rgba(0,0,0,0.2);
            border-radius: 6px;
        }
        .detail-label { color: #888; min-width: 120px; }
        .detail-value { flex: 1; }
        .research-result, .design-doc {
            margin-top: 15px; padding: 15px;
            background: rgba(0,0,0,0.2); border-radius: 8px;
            border-left: 3px solid #00d4ff;
        }
        .research-result h4, .design-doc h4 {
            color: #00d4ff; margin-bottom: 10px;
        }
        .view-doc-link {
            color: #00ff88; cursor: pointer;
            text-decoration: underline;
        }

        .refresh-info {
            text-align: center; color: #666;
            font-size: 0.85em; margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎯 Job Dispatch Dashboard</h1>
        <p>Multi-Agent Workflow Coordination</p>
        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="total-jobs">0</div>
                <div class="stat-label">Total Jobs</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="active-jobs">0</div>
                <div class="stat-label">In Progress</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="completed-jobs">0</div>
                <div class="stat-label">Completed</div>
            </div>
        </div>
    </div>

    <div class="active-agents" id="active-agents"></div>

    <div class="agent-filter">
        <button class="agent-btn" onclick="switchView('all')">All Jobs</button>
        <button class="agent-btn active" onclick="switchView('agents')">Agent Queues</button>
    </div>

    <div class="agents-overview" id="agents-overview"></div>
    <div class="jobs-container" id="jobs-container" style="display: none;"></div>

    <div class="refresh-info">
        Auto-refreshes every 5 seconds • Last updated: <span id="last-updated">--</span>
    </div>

    <!-- Job Detail Modal -->
    <div class="modal-overlay" id="job-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Job Details</h2>
                <span class="modal-close" onclick="closeModal()">&times;</span>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        const API_URL = '/api/jobs';
        let allJobsData = [];
        let currentView = 'agents';
        let expandedQueues = {};
        const AGENTS = ['Mac', 'Glitch', 'Sage', 'Atlas'];
        const AGENT_TITLES = {
            'Mac': 'Mac 🖥️ (Leader)',
            'Glitch': 'Glitch ⚡ (Coder)',
            'Sage': 'Sage 🔍 (Analyst)',
            'Atlas': 'Atlas 📋 (Architect)'
        };

        function formatDate(isoString) {
            if (!isoString) return 'N/A';
            const date = new Date(isoString);
            return date.toLocaleString();
        }

        function formatDuration(minutes) {
            if (!minutes) return 'N/A';
            if (minutes < 60) return `${minutes} min`;
            const hours = Math.floor(minutes / 60);
            const mins = minutes % 60;
            return mins > 0 ? `${hours}h ${mins}m` : `${hours}h`;
        }

        function getStatusClass(status) {
            return `status-${status.toLowerCase()}`;
        }

        function getAgentClass(agent) {
            const agentLower = agent.toLowerCase();
            if (agentLower.includes('mac')) return 'mac';
            if (agentLower.includes('glitch')) return 'glitch';
            if (agentLower.includes('research')) return 'research';
            if (agentLower.includes('planning')) return 'planning';
            return '';
        }

        function getStatusIcon(status) {
            if (status === 'DONE') return '✅';
            if (status === 'IN_PROGRESS') return '🔄';
            return '⏳';
        }

        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.agent-btn').forEach((btn, index) => {
                btn.classList.toggle('active',
                    (view === 'all' && index === 0) ||
                    (view === 'agents' && index === 1));
            });

            document.getElementById('agents-overview').style.display = view === 'agents' ? 'block' : 'none';
            document.getElementById('jobs-container').style.display = view === 'all' ? 'block' : 'none';

            if (view === 'all') renderAllJobs();
            else renderAgentsOverview();
        }

        function showJobDetails(job) {
            const modal = document.getElementById('job-modal');
            const body = document.getElementById('modal-body');

            let extraContent = '';

            // Research result section
            if (job.research_result) {
                extraContent += `
                    <div class="research-result">
                        <h4>📚 Research Results</h4>
                        <p><strong>Query:</strong> ${job.research_result.query}</p>
                        <p><strong>Summary:</strong> ${job.research_result.summary}</p>
                        ${job.research_result.sources ? `
                            <p><strong>Sources:</strong></p>
                            <ul>
                                ${job.research_result.sources.map(s =>
                                    `<li><a href="${s.url}" target="_blank" style="color: #00d4ff;">${s.title}</a></li>`
                                ).join('')}
                            </ul>
                        ` : ''}
                    </div>
                `;
            }

            // Design doc section
            if (job.design_doc) {
                extraContent += `
                    <div class="design-doc">
                        <h4>📋 Design Document</h4>
                        <p><strong>Title:</strong> ${job.design_doc.title}</p>
                        <p><strong>Overview:</strong> ${job.design_doc.overview}</p>
                        <p><strong>Architecture:</strong> ${job.design_doc.architecture}</p>
                        <p><strong>Tech Stack:</strong> ${job.design_doc.tech_stack}</p>
                        <p><strong>Estimated Effort:</strong> ${job.design_doc.estimated_effort}</p>
                        ${job.design_doc.components ? `
                            <p><strong>Components:</strong></p>
                            <ul>
                                ${job.design_doc.components.map(c =>
                                    `<li><strong>${c.name}:</strong> ${c.description}</li>`
                                ).join('')}
                            </ul>
                        ` : ''}
                    </div>
                `;
            }

            body.innerHTML = `
                <div class="detail-row">
                    <span class="detail-label">Job ID:</span>
                    <span class="detail-value">#${job.id}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Description:</span>
                    <span class="detail-value">${job.description}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Status:</span>
                    <span class="detail-value">${getStatusIcon(job.status)} ${job.status}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Assigned To:</span>
                    <span class="detail-value">${job.assigned_to}</span>
                </div>
                ${job.dispatched_by ? `
                    <div class="detail-row">
                        <span class="detail-label">Dispatched By:</span>
                        <span class="detail-value">${job.dispatched_by}</span>
                    </div>
                ` : ''}
                <div class="detail-row">
                    <span class="detail-label">Created:</span>
                    <span class="detail-value">${formatDate(job.created_at)}</span>
                </div>
                ${job.started_at ? `
                    <div class="detail-row">
                        <span class="detail-label">Started:</span>
                        <span class="detail-value">${formatDate(job.started_at)}</span>
                    </div>
                ` : ''}
                ${job.completed_at ? `
                    <div class="detail-row">
                        <span class="detail-label">Completed:</span>
                        <span class="detail-value">${formatDate(job.completed_at)}</span>
                    </div>
                ` : ''}
                ${job.estimated_minutes ? `
                    <div class="detail-row">
                        <span class="detail-label">Estimated:</span>
                        <span class="detail-value">${formatDuration(job.estimated_minutes)}</span>
                    </div>
                ` : ''}
                ${job.completed_at && job.started_at ? `
                    <div class="detail-row">
                        <span class="detail-label">Actual Duration:</span>
                        <span class="detail-value">${formatDuration(
                            Math.round((new Date(job.completed_at) - new Date(job.started_at)) / 60000)
                        )}</span>
                    </div>
                ` : ''}
                ${job.priority ? `
                    <div class="detail-row">
                        <span class="detail-label">Priority:</span>
                        <span class="detail-value">${job.priority}</span>
                    </div>
                ` : ''}
                ${extraContent}
            `;

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('job-modal').classList.remove('active');
        }

        function toggleQueueExpansion(agent, queueType) {
            const key = `${agent}-${queueType}`;
            expandedQueues[key] = !expandedQueues[key];
            renderAgentsOverview();
        }

        function renderAgentQueueItems(jobs, agent, queueType, maxInitial = 5) {
            const key = `${agent}-${queueType}`;
            const isExpanded = expandedQueues[key];
            const displayJobs = isExpanded ? jobs : jobs.slice(0, maxInitial);

            let html = displayJobs.map(job => `
                <div class="agent-card-queue-item" onclick='showJobDetails(${JSON.stringify(job).replace(/'/g, "&#39;")})'>
                    <span>${getStatusIcon(job.status)}</span>
                    <span style="font-family: monospace; color: #888; font-size: 0.85em;">#${job.id}</span>
                    <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${job.description}</span>
                    ${job.estimated_minutes ? `<span style="color: #666; font-size: 0.8em;">${formatDuration(job.estimated_minutes)}</span>` : ''}
                </div>
            `).join('');

            if (jobs.length > maxInitial) {
                html += `
                    <div class="expand-link" onclick="event.stopPropagation(); toggleQueueExpansion('${agent}', '${queueType}')">
                        ${isExpanded ? '▼ Show less' : `▲ Show ${jobs.length - maxInitial} more...`}
                    </div>
                `;
            }

            return html;
        }

        function calculateJobProgress(job) {
            if (!job.started_at || !job.estimated_minutes) return 0;

            const startTime = new Date(job.started_at).getTime();
            const now = Date.now();
            const elapsed = (now - startTime) / 1000 / 60; // minutes

            // Cap at 95% until actually done
            const progress = Math.min(95, (elapsed / job.estimated_minutes) * 100);
            return Math.round(progress);
        }

        function renderInProgressJobs(jobs, agent, maxInitial = 3) {
            const key = `${agent}-inprogress`;
            const isExpanded = expandedQueues[key];
            const displayJobs = isExpanded ? jobs : jobs.slice(0, maxInitial);

            let html = displayJobs.map(job => {
                const progress = calculateJobProgress(job);
                const elapsed = job.started_at ?
                    Math.round((Date.now() - new Date(job.started_at).getTime()) / 1000 / 60) : 0;
                const estimated = job.estimated_minutes || 30;
                const remaining = Math.max(0, estimated - elapsed);

                return `
                    <div class="agent-card-queue-item" onclick='showJobDetails(${JSON.stringify(job).replace(/'/g, "&#39;")})' style="flex-wrap: wrap;">
                        <div style="display: flex; align-items: center; gap: 8px; width: 100%;">
                            <span>${getStatusIcon(job.status)}</span>
                            <span style="font-family: monospace; color: #888; font-size: 0.85em;">#${job.id}</span>
                            <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${job.description}</span>
                            <span style="color: #f0a500; font-size: 0.8em; font-weight: bold;">${progress}%</span>
                        </div>
                        <div style="width: 100%; margin-top: 8px; padding-left: 24px;">
                            <div class="job-progress-container">
                                <div class="job-progress-bar" style="width: ${progress}%"></div>
                            </div>
                            <div class="job-progress-text">
                                ⏱️ ${elapsed}m elapsed / ${estimated}m estimated (${remaining}m remaining)
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            if (jobs.length > maxInitial) {
                html += `
                    <div class="expand-link" onclick="event.stopPropagation(); toggleQueueExpansion('${agent}', 'inprogress')">
                        ${isExpanded ? '▼ Show less' : `▲ Show ${jobs.length - maxInitial} more...`}
                    </div>
                `;
            }

            return html;
        }

        function renderMacEscalations(jobs) {
            const escalations = jobs.filter(j =>
                j.description.toLowerCase().includes('escalation') ||
                j.description.toLowerCase().includes('exceeded') ||
                j.description.includes('⚠️')
            );
            
            let html = `
                <div class="agent-card-queue-title" style="color: #ff6b6b; font-weight: bold;">
                    🚨 HIGH PRIORITY ESCALATIONS (${escalations.length})
                </div>
            `;
            
            if (escalations.length === 0) {
                html += `<div class="agent-card-empty" style="color: #666;">No escalations</div>`;
            } else {
                html += escalations.slice(0, 3).map(job => `
                    <div class="agent-card-queue-item" style="border-left: 3px solid #ff6b6b; background: rgba(255, 107, 107, 0.1);"
                         onclick='showJobDetails(${JSON.stringify(job).replace(/'/g, "&#39;")})'>
                        <span>🚨</span>
                        <span style="font-family: monospace; color: #888; font-size: 0.85em;">#${job.id}</span>
                        <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ff6b6b;">
                            ${job.description}
                        </span>
                    </div>
                `).join('');
                
                if (escalations.length > 3) {
                    html += `<div class="expand-link">... and ${escalations.length - 3} more escalations</div>`;
                }
            }
            
            return html;
        }

        function renderMacRegularQueue(jobs) {
            const regular = jobs.filter(j =>
                !j.description.toLowerCase().includes('escalation') &&
                !j.description.toLowerCase().includes('exceeded') &&
                !j.description.includes('⚠️')
            );
            
            let html = `
                <div class="agent-card-queue-title">
                    ⏳ Regular Completions (${regular.length})
                </div>
            `;
            
            if (regular.length === 0) {
                html += `<div class="agent-card-empty" style="color: #666;">No regular completions</div>`;
            } else {
                html += regular.slice(0, 5).map(job => `
                    <div class="agent-card-queue-item" onclick='showJobDetails(${JSON.stringify(job).replace(/'/g, "&#39;")})'>
                        <span>${getStatusIcon(job.status)}</span>
                        <span style="font-family: monospace; color: #888; font-size: 0.85em;">#${job.id}</span>
                        <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                            ${job.description}
                        </span>
                    </div>
                `).join('');
                
                if (regular.length > 5) {
                    html += `<div class="expand-link" onclick="event.stopPropagation();">... and ${regular.length - 5} more</div>`;
                }
            }
            
            return html;
        }

        function renderAgentsOverview() {
            const container = document.getElementById('agents-overview');

            const agentCards = AGENTS.map(agent => {
                const agentJobs = allJobsData.filter(j =>
                    j.assigned_to.toLowerCase() === agent.toLowerCase()
                );

                const pending = agentJobs.filter(j => j.status === 'TODO');
                const inProgress = agentJobs.filter(j => j.status === 'IN_PROGRESS');
                const completed = agentJobs.filter(j => j.status === 'DONE');

                const badgeClass = agent.toLowerCase();
                const title = AGENT_TITLES[agent];

                return `
                    <div class="agent-card">
                        <div class="agent-card-header">
                            <div class="agent-card-name">👤 ${title}</div>
                            <span class="agent-card-badge ${badgeClass}">${agent}</span>
                        </div>
                        <div class="agent-card-stats">
                            <div class="agent-card-stat">
                                <div class="agent-card-stat-value" style="color: #f0a500;">${inProgress.length}</div>
                                <div class="agent-card-stat-label">In Progress</div>
                            </div>
                            <div class="agent-card-stat">
                                <div class="agent-card-stat-value" style="color: #00d4ff;">${pending.length}</div>
                                <div class="agent-card-stat-label">Pending</div>
                            </div>
                            <div class="agent-card-stat">
                                <div class="agent-card-stat-value" style="color: #00ff88;">${completed.length}</div>
                                <div class="agent-card-stat-label">Done</div>
                            </div>
                        </div>
                        ${inProgress.length > 0 ? `
                            <div class="agent-card-queue">
                                <div class="agent-card-queue-title">🔨 In Progress (${inProgress.length})</div>
                                ${renderInProgressJobs(inProgress, agent, 3)}
                            </div>
                        ` : ''}
                        ${agent === 'Mac' ? `
                            <div class="agent-card-queue">
                                ${renderMacEscalations(pending)}
                            </div>
                            <div class="agent-card-queue" style="margin-top: 15px;">
                                ${renderMacRegularQueue(pending)}
                            </div>
                        ` : (pending.length > 0 ? `
                            <div class="agent-card-queue">
                                <div class="agent-card-queue-title">⏳ Pending Queue (${pending.length})</div>
                                ${renderAgentQueueItems(pending, agent, 'pending', 5)}
                            </div>
                        ` : '')}
                    </div>
                `;
            }).join('');

            container.innerHTML = `<div class="agents-grid">${agentCards}</div>`;
        }

        function renderActiveAgents() {
            const container = document.getElementById('active-agents');
            const activeAgents = AGENTS.filter(agent => {
                const agentJobs = allJobsData.filter(j =>
                    j.assigned_to.toLowerCase() === agent.toLowerCase() &&
                    j.status === 'IN_PROGRESS'
                );
                return agentJobs.length > 0;
            });

            if (activeAgents.length === 0) {
                container.innerHTML = '<div style="color: #666; padding: 10px;">No agents currently active</div>';
                return;
            }

            container.innerHTML = activeAgents.map(agent => {
                const agentJobs = allJobsData.filter(j =>
                    j.assigned_to.toLowerCase() === agent.toLowerCase() &&
                    j.status === 'IN_PROGRESS'
                );
                const badgeClass = agent.toLowerCase();
                const title = AGENT_TITLES[agent];
                return `
                    <div class="active-agent-badge ${badgeClass}">
                        <span class="indicator"></span>
                        <span>🔨 ${title}</span>
                        <span style="font-weight: bold;">${agentJobs.length}</span>
                    </div>
                `;
            }).join('');
        }

        function renderAllJobs() {
            const container = document.getElementById('jobs-container');
            const mainJobs = allJobsData.filter(j => j.parent_id === null);

            if (mainJobs.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 60px; color: #666;">
                        <div style="font-size: 4em; margin-bottom: 20px;">📭</div>
                        <h2>No jobs yet</h2>
                    </div>
                `;
                return;
            }

            // Simple list view for all jobs
            container.innerHTML = mainJobs
                .sort((a, b) => b.id - a.id)
                .map(job => `
                    <div class="agent-card" style="margin-bottom: 15px; cursor: pointer;" onclick='showJobDetails(${JSON.stringify(job).replace(/'/g, "&#39;")})'>
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span style="font-weight: bold;">#${job.id}: ${job.description}</span>
                            <span style="color: ${job.status === 'DONE' ? '#00ff88' : job.status === 'IN_PROGRESS' ? '#f0a500' : '#00d4ff'};">
                                ${getStatusIcon(job.status)} ${job.status}
                            </span>
                        </div>
                        <div style="color: #888; font-size: 0.9em; margin-top: 8px;">
                            👤 ${job.assigned_to} | 📅 ${formatDate(job.created_at)}
                            ${job.dispatched_by ? `| 📤 Dispatched by: ${job.dispatched_by}` : ''}
                        </div>
                    </div>
                `).join('');
        }

        async function loadJobs() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                allJobsData = data.jobs || [];

                document.getElementById('total-jobs').textContent = allJobsData.length;
                document.getElementById('active-jobs').textContent =
                    allJobsData.filter(j => j.status === 'IN_PROGRESS').length;
                document.getElementById('completed-jobs').textContent =
                    allJobsData.filter(j => j.status === 'DONE').length;

                renderActiveAgents();

                if (currentView === 'all') renderAllJobs();
                else renderAgentsOverview();

                document.getElementById('last-updated').textContent = new Date().toLocaleTimeString();
            } catch (error) {
                console.error('Failed to load jobs:', error);
            }
        }

        // Close modal on outside click
        document.getElementById('job-modal').addEventListener('click', (e) => {
            if (e.target.id === 'job-modal') closeModal();
        });

        // Initial load
        loadJobs();
        setInterval(loadJobs, 5000);
    </script>
</body>
</html>
